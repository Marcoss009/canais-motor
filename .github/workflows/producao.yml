name: Produção (render + publicação)

# Cada pedido em producao/pedidos/ vira um job: voz -> cenas oficiais -> EffectCraft -> YouTube (privado + agendado
# no slot, aprovação automática). Roda na nuvem do GitHub: não depende do notebook nem gasta créditos do Claude.
on:
  push:
    paths: ["producao/pedidos/**"]
  schedule:
    - cron: "*/30 * * * *"   # pega pedido esquecido e confere a agenda
  workflow_dispatch:

concurrency:
  group: producao
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  GH_TOKEN: ${{ github.token }}
  TZ: America/Sao_Paulo

jobs:
  listar:
    runs-on: ubuntu-latest
    outputs:
      pedidos: ${{ steps.l.outputs.pedidos }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          echo "pedidos=$(python3 -c 'import json,glob,os;print(json.dumps([os.path.basename(p) for p in sorted(glob.glob("producao/pedidos/*.json"))]))')" >> "$GITHUB_OUTPUT"

  render:
    needs: listar
    if: needs.listar.outputs.pedidos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pedido: ${{ fromJson(needs.listar.outputs.pedidos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/cache@v4
        with:
          path: |
            ~/craft
            motor_pro/cache_img
          key: craft-${{ runner.os }}-v1-${{ hashFiles('requirements.txt') }}
      - name: Preparar (ffmpeg, EffectCraft, fontes, credenciais)
        run: bash ci/preparar.sh
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_GTA6: ${{ secrets.YT_TOKEN_GTA6 }}
          YT_TOKEN_ENGENHOSO: ${{ secrets.YT_TOKEN_ENGENHOSO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      - name: Renderizar e publicar ${{ matrix.pedido }}
        run: python render_fila.py --pedido "${{ matrix.pedido }}"
      - name: Guardar o vídeo para conferência (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.pedido }}
          path: |
            fila/*/*/video.mp4
            fila/*/*/thumb.jpg
            dados/_render_*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Gravar o estado
        if: always()
        run: bash ci/salvar.sh "render ${{ matrix.pedido }}"

  fila:
    needs: [listar, render]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -q -r requirements.txt
      - name: Credenciais
        run: |
          mkdir -p credenciais
          echo "${{ secrets.YT_CLIENT_SECRET }}" | base64 -d > credenciais/client_secret.json
          echo "${{ secrets.YT_TOKEN_GTA6 }}" | base64 -d > credenciais/token_gta6.json
          echo "${{ secrets.YT_TOKEN_ENGENHOSO }}" | base64 -d > credenciais/token_engenhoso.json
      - name: Conferir agenda (agendado -> publicado)
        run: python publicar.py
      - name: Gravar o estado
        run: bash ci/salvar.sh "fila"
